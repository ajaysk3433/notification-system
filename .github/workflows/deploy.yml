name: Deploy notification to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /root/ci_cd
            mkdir -p /root/ci_cd
            cd /root/ci_cd

            

            git clone https://github.com/ajaysk3433/notification-system.git

            cd notification-system
            cp -r /root/app_config/notification/* .

            docker stop notification || true
            docker rm notification || true
            docker rmi notification:latest || true

            docker build -t notification .

            docker run -d \
              --name notification \
              --restart unless-stopped \
              -e NODE_ENV=production \
              --network app-net \
              notification

            docker image prune -f